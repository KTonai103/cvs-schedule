function addDays(dateStr, n) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d + n);
  return String(dt.getFullYear()) + String(dt.getMonth()+1).padStart(2,'0') + String(dt.getDate()).padStart(2,'0');
}
function getDoW(dateStr) { return new Date(dateStr + 'T00:00:00+09:00').getDay(); }
function fmtDate(dateStr) {
  const m = parseInt(dateStr.slice(5,7)), d = parseInt(dateStr.slice(8,10));
  const dow = ['日','月','火','水','木','金','土'][getDoW(dateStr)];
  return `${m}/${d}(${dow})`;
}

function toggleMember(name) { const a=activeMembers.has(name); activeMembers.clear(); if(!a) activeMembers.add(name); applyHighlight(); }

function applyHighlight() {
  const hasActive=activeMembers.size>0;
  const activeName=hasActive?Array.from(activeMembers)[0]:'';
  if (memberSelect && memberSelect.value!==activeName) memberSelect.value=activeName;
  if (memberIcsBtn) memberIcsBtn.disabled=!hasActive;
  document.querySelectorAll('.member-btn').forEach(btn => {
    const n=btn.dataset.name;
    if (activeMembers.has(n)) { btn.classList.add('active'); btn.style.backgroundColor=MEMBERS[n].color; btn.style.borderColor=MEMBERS[n].color; btn.style.color='white'; }
    else { btn.classList.remove('active'); btn.style.backgroundColor='white'; btn.style.borderColor=MEMBERS[n].color; btn.style.color=MEMBERS[n].color; }
  });
  document.querySelectorAll('.shift,.ext-shift,.mobile-shift,.mobile-ext').forEach(el => {
    const p=el.dataset.person;
    if (!hasActive) { el.classList.remove('dim','lit'); el.style.outlineColor=''; el.style.backgroundColor=''; }

}

function downloadICS(memberName) {
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//OSU CVS//当直表 2026-08//JA','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-TIMEZONE:Asia/Tokyo','X-WR-CALNAME:'+memberName+' 当直 2026年8月','BEGIN:VTIMEZONE','TZID:Asia/Tokyo','BEGIN:STANDARD','TZOFFSETFROM:+0900','TZOFFSETTO:+0900','TZNAME:JST','DTSTART:19700101T000000','END:STANDARD','END:VTIMEZONE'];
  let uid=1;
  DAYS.forEach(day => {
    const ds=day.date.replace(/-/g,''), nextDs=addDays(day.date,1);
    for (const {key,label,summary,desc} of SLOTS) {
      if (day[key]===memberName) lines.push('BEGIN:VEVENT',`UID:${label}-${day.date}-${uid++}@osu-cvs`,`DTSTART;VALUE=DATE:${ds}`,`DTEND;VALUE=DATE:${nextDs}`,`SUMMARY:${summary}`,`DESCRIPTION:${desc}`,'LOCATION:大阪大学附属病院 心臓血管外科','END:VEVENT');
    }
    day.ext.forEach(e => {
      if (e.person!==memberName) return;
      const endDs=addDays(day.date,e.icsE_d);
      lines.push('BEGIN:VEVENT',`UID:ext-${day.date}-${e.fac}-${uid++}@osu-cvs`,`DTSTART;TZID=Asia/Tokyo:${ds}T${e.icsS}`,`DTEND;TZID=Asia/Tokyo:${endDs}T${e.icsE_t}`,`SUMMARY:外勤 ${e.fac}`,`DESCRIPTION:外勤 ${e.fac}\\n${e.time}`,`LOCATION:${e.fac}`,'END:VEVENT');
    });
  });
  lines.push('END:VCALENDAR');
  const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=`schedule_2026August_${memberName}.ics`; a.click(); URL.revokeObjectURL(url);
}

(function buildTodaySection() {
  const now=new Date(), toStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const todayStr=toStr(now), tmrw=new Date(now); tmrw.setDate(tmrw.getDate()+1); const tmrwStr=toStr(tmrw);
  document.querySelectorAll('.cal-cell[data-date]').forEach(c=>{ if (c.dataset.date===todayStr) c.classList.add('today'); });
  document.querySelectorAll('.mobile-day[data-date]').forEach(c=>{ if (c.dataset.date===todayStr) c.classList.add('today'); });
  const todayDay=DAYS.find(d=>d.date===todayStr), tmrwDay=DAYS.find(d=>d.date===tmrwStr);
  if (!todayDay&&!tmrwDay) return;
  const container=document.getElementById('today-section'); container.classList.remove('ts-none');
  function buildCard(day,label,labelClass) {
    if (!day) return '';
    const dow=['日','月','火','水','木','金','土'][getDoW(day.date)],m=parseInt(day.date.slice(5,7)),d=parseInt(day.date.slice(8));
    const holTag=day.hol?`<span class="ts-hol">${day.holName}</span>`:'';
    const fC=MEMBERS[day.f]?.color||'#333',sC=MEMBERS[day.s]?.color||'#333',tC=day.t?(MEMBERS[day.t]?.color||'#333'):null;
    let extH=''; day.ext.forEach(e=>{ const c=MEMBERS[e.person]?.color||'#333'; extH+=`<div class="ts-ext"><span class="ts-ext-fac">${e.fac}</span><span class="ts-ext-name" style="color:${c}">${e.person}</span><span class="ts-ext-time">${e.time}</span></div>`; });
    const eventH=day.event?`<div class="ts-event-row">${day.event}</div><div class="ts-event-ppl">${day.eventPpl}</div>`:'';
    return `<div class="ts-card"><div class="ts-label ${labelClass}">${label} <span class="ts-date">${m}/${d}（${dow}）</span>${holTag}</div><div class="ts-row"><span class="ts-row-lbl">1st</span><span class="ts-row-name" style="color:${fC}">${day.f}</span></div><div class="ts-row"><span class="ts-row-lbl">2nd</span><span class="ts-row-name" style="color:${sC}">${day.s}</span></div>${day.t?`<div class="ts-row"><span class="ts-row-lbl">3rd</span><span class="ts-row-name" style="color:${tC}">${day.t}</span></div>`:''}${extH}${eventH}</div>`;
  }
  container.innerHTML=buildCard(todayDay,'TODAY','ts-label-today')+buildCard(tmrwDay,'TOMORROW','ts-label-tomorrow');
})();
